name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # El nombre "frontend" es el check obligatorio de la protección de ramas: no cambiarlo.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Valida migraciones, semillas, RLS y funciones contra un Supabase local en Docker.
  base-de-datos:
    name: base-de-datos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Aplica migraciones y semillas al arrancar. Sin los servicios que no usan las pruebas.
      - run: npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime
      - run: npm run db:lint
      - run: npm run db:test
      - name: Tipos al día
        run: |
          npx supabase gen types typescript --local > /tmp/database.ts
          diff -u src/types/database.ts /tmp/database.ts
